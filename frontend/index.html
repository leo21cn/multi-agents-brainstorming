<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg">
<title>火花会 Sparkwave</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  .hero{min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fbfcfe,#f3f6fb);padding:40px 24px}
  .panel{width:100%;max-width:720px;text-align:center}
  .mark{width:72px;height:72px;border-radius:20px;margin:0 auto 18px;display:block;box-shadow:0 10px 30px rgba(43,127,255,.22)}
  h1{font-size:26px;margin:0 0 6px;font-weight:600;letter-spacing:.01em}
  .tag{color:var(--text-dim);font-size:14.5px;margin:0 auto 8px;max-width:520px;line-height:1.7}
  .en{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--text-faint);text-transform:uppercase;margin-bottom:28px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
  .entry{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:left;transition:.16s;display:block}
  .entry:hover{border-color:var(--accent);box-shadow:0 12px 30px rgba(31,35,41,.08);transform:translateY(-2px)}
  .entry .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;margin-bottom:14px}
  .entry .t{font-size:16px;font-weight:600;margin-bottom:4px}
  .entry .d{font-size:13px;color:var(--text-dim);line-height:1.6}
  .entry .go{margin-top:14px;font-size:13px;color:var(--accent-strong);font-weight:500}
  .foot{margin-top:28px;font-size:12px;color:var(--text-faint)}
  .foot code{font-family:var(--mono);background:#eef1f5;padding:1px 6px;border-radius:5px}
  @media(max-width:600px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hero">
  <div class="panel">
    <img class="mark" src="/assets/icon/sparkwave-app-icon.svg" alt="火花会 Sparkwave">
    <h1>火花会</h1>
    <div class="en">Sparkwave</div>
    <p class="tag">人机混合头脑风暴工具。多个绑定不同知识库的智能体，在人类主持下围绕一个命题差异化发言、暴露分歧，并生成带来源标注的阶段结论。</p>
    <div class="cards">
      <a class="entry" href="/admin/">
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        <div class="t">管理后台</div>
        <div class="d">系统级配置：初始化状态、知识库与文档、模型连接、智能体（含人设与发言风格）。</div>
        <div class="go">进入配置 →</div>
      </a>
      <a class="entry" href="/lobby/">
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="t">头脑风暴房间</div>
        <div class="d">建房、群聊与来源标注、成员与邀请、举手队列、阶段结论与导出下载。</div>
        <div class="go">进入房间 →</div>
      </a>
    </div>
    <div class="foot">单机演示版 · 需先运行 <code>python tasks.py seed</code> 完成入库与配置</div>
  </div>
</div>
<script src="/assets/api.js"></script>
<script src="/assets/ui.js"></script>
<script>
  // 首页守卫：未初始化（无知识库或无已绑定知识库的智能体）时，跳转到管理后台初始化状态页。
  (async function () {
    const r = await api.get('/system/init-status');
    if (r.ok && r.body && r.body.ready === false) {
      location.replace('/admin/?init=1');
    }
  })();
</script>
</body>
</html>
